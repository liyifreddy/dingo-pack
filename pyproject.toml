[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dingo-pack"
dynamic = ["version"]
description = "The pack eats in order: heavy-job slots, memory admission and a crash-recovery session roster for many AI agents on one machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "liyifreddy" }]
keywords = ["multi-agent", "claude-code", "memory", "oom", "queue", "wsl", "sessions"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/liyifreddy/dingo-pack"
Issues = "https://github.com/liyifreddy/dingo-pack/issues"

[project.scripts]
dingo-pack = "dingo_pack:main"

[tool.hatch.version]
path = "bin/dingo-pack"

# The CLI stays one file (bin/dingo-pack); the wheel ships it as the module dingo_pack.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"bin/dingo-pack" = "dingo_pack.py"

[tool.hatch.build.targets.sdist]
include = ["bin/", "hooks/", "skills/", "README.md", "README.zh-CN.md", 
           "REFERENCE.md", "ADAPTERS.md", "CHANGELOG.md", "RELEASING.md", "LICENSE", "selftest_dingo_pack.py", "selftest_release.py", ".github/workflows/"]
